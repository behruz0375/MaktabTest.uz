# Render.com uchun avtomatik sozlama (Blueprint)
# Render'da: New +  ->  Blueprint  ->  GitHub repongizni tanlang.
services:
  - type: web
    name: maktabtest
    runtime: python
    plan: free                # BEPUL reja
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: SECRET_KEY
        generateValue: true    # Render avtomatik maxfiy kalit yaratadi
      - key: PYTHON_VERSION
        value: "3.12.10"

